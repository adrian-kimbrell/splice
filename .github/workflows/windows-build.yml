name: Windows Build

# Phase 1 of the Windows port: produce a clickable installer to test against.
# Builds the bundle (MSI + NSIS), uploads it as an artifact, and publishes it to
# a rolling "windows-preview" GitHub pre-release so the website can link a public
# download. Unsigned, so SmartScreen warns on first launch — fine for testing.
# Runs only on the windows-support branch (and on demand).

on:
  push:
    branches: [windows-support]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    name: Build installer (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Windows-only code paths (process liveness, clipboard, ssh.exe session,
      # hook install) can't be exercised on a macOS dev machine, so this is the only
      # place they actually run. Tests before the build: a failure here is a real bug,
      # and finding it after a 10-minute bundle is a waste.
      - name: Frontend tests
        run: npm test

      # Not fatal on its own: a load failure here needs the diagnosis below to be
      # actionable, and the bundle step still tells us the app itself links.
      - name: Rust tests
        id: rust_tests
        continue-on-error: true
        run: cargo test
        working-directory: src-tauri

      # A binary can link cleanly and still fail to load (STATUS_ENTRYPOINT_NOT_FOUND)
      # when an imported symbol isn't in the DLL it was bound to. The loader never names
      # the culprit and no macOS build links these paths, so dump the imports of the two
      # DLLs that aren't plain kernel32/user32, and confirm the runner actually exports
      # what the binary asks for.
      - name: Diagnose load failure (imports)
        if: steps.rust_tests.outcome == 'failure'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { Write-Host 'dumpbin not found'; exit 0 }
          $exe = Get-ChildItem target\debug\deps -Filter 'splice_lib-*.exe' | Select-Object -First 1
          Write-Host "== full imports: $($exe.Name) =="
          & $dumpbin /imports $exe.FullName |
            Select-String -Pattern 'bcryptprimitives|api-ms-win-core-synch|ProcessPrng|WaitOnAddress|WakeByAddress' -Context 0,6
          Write-Host "== does this runner export them? =="
          foreach ($d in @('bcryptprimitives.dll','api-ms-win-core-synch-l1-2-0.dll','kernel32.dll')) {
            $p = Join-Path $env:SystemRoot "System32\$d"
            if (Test-Path $p) {
              Write-Host "$d present"
              & $dumpbin /exports $p | Select-String -Pattern 'ProcessPrng|WaitOnAddress|WakeByAddressSingle'
            } else { Write-Host "$d MISSING" }
          }
          Write-Host "== OS build =="
          [System.Environment]::OSVersion.VersionString

      # WebView2 + MSVC are preinstalled; the Tauri CLI auto-fetches WiX/NSIS.
      - name: Build bundle (MSI + NSIS)
        run: npm run tauri:build

      # Every previous green run only *built* the app — nothing ever started it, so a
      # binary that links but can't load would have shipped looking healthy. Launch it
      # and check it stays up: exit code 0xc0000139 here means the installer is broken.
      - name: Smoke-test the built app
        shell: pwsh
        working-directory: src-tauri
        run: |
          $exe = 'target\release\splice.exe'
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            $code = '0x{0:X8}' -f $p.ExitCode
            throw "app exited on startup with $code"
          }
          Write-Host 'App started and stayed running.'
          Stop-Process -Id $p.Id -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: splice-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      # Rolling public pre-release: each push to windows-support refreshes the
      # "windows-preview" release with the latest installers. Linked from the
      # website's Experimental page.
      - name: Publish windows-preview pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-preview
          name: Windows Preview (experimental dev build)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            ## Splice for Windows — experimental dev build

            ⚠️ **Work in progress. Unsigned. Things will break.** This is an
            automated build from the `windows-support` branch, not a release.

            - **Unsigned** — Windows SmartScreen will warn on first launch
              ("More info" → "Run anyway").
            - **Shortcuts inside a terminal use Ctrl+Shift**, since plain Ctrl
              belongs to the shell. Copy is Ctrl+Shift+C; paste is Ctrl+V.
            - **Remote workspaces** use the OpenSSH client bundled with Windows.
              Without ControlMaster each request reconnects, so the file tree is
              slower than on macOS, and key auth (or a running ssh-agent) is
              required — there's no prompt for a password.

            Updated automatically on every push to `windows-support`.

            **Install:** download the `-setup.exe` (NSIS) or `.msi` below.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
