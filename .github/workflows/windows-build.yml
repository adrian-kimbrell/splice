name: Windows Build

# Phase 1 of the Windows port: produce a clickable installer to test against.
# Builds the bundle (MSI + NSIS) and uploads it as an artifact. Unsigned, so
# SmartScreen will warn on first launch — fine for testing. Runs only on the
# windows-support branch (and on demand) so it never touches the macOS release.

on:
  push:
    branches: [windows-support]
  workflow_dispatch:

jobs:
  windows-build:
    name: Build installer (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # WebView2 + MSVC are preinstalled; the Tauri CLI auto-fetches WiX/NSIS.
      - name: Build bundle (MSI + NSIS)
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: splice-windows-x64
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
