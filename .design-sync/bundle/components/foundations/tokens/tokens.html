<!-- @dsCard group="Foundations" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#00ff88;--bg:#1e1e1e;--card:#252526;--raised:#2d2d30;--border:#3c3c3c}
  body{background:#1e1e1e;color:#f4f4f5;font-family:'JetBrains Mono',monospace}
  .sw{width:100%;height:56px;border:1px solid #3c3c3c}
  .lbl{font-size:.7rem;color:#a1a1aa;margin-top:.4rem}
  .hex{font-size:.7rem;color:#71717a}
</style></head>
<body class="p-8">
  <p class="text-xs uppercase tracking-[0.2em]" style="color:#00ff88">Foundations</p>
  <h2 class="text-xl font-bold text-white mt-1 mb-6">Tokens</h2>

  <div class="grid grid-cols-3 sm:grid-cols-6 gap-4 mb-8">
    <div><div class="sw" style="background:#00ff88"></div><div class="lbl">brand</div><div class="hex">#00ff88</div></div>
    <div><div class="sw" style="background:#1e1e1e"></div><div class="lbl">bg</div><div class="hex">#1e1e1e</div></div>
    <div><div class="sw" style="background:#252526"></div><div class="lbl">card</div><div class="hex">#252526</div></div>
    <div><div class="sw" style="background:#2d2d30"></div><div class="lbl">raised</div><div class="hex">#2d2d30</div></div>
    <div><div class="sw" style="background:#3c3c3c"></div><div class="lbl">border</div><div class="hex">#3c3c3c</div></div>
    <div><div class="sw" style="background:#f4f4f5"></div><div class="lbl">text</div><div class="hex">#f4f4f5</div></div>
  </div>

  <p class="text-xs uppercase tracking-[0.2em] mb-3" style="color:#00ff88">Type — JetBrains Mono</p>
  <p class="text-3xl font-bold text-white">Your work is parallel.</p>
  <p class="text-sm mt-2" style="color:#a1a1aa">Body copy sits at zinc-400 on the dark surface for comfortable reading.</p>
  <p class="text-xs mt-2" style="color:#71717a">Captions and nav use zinc-500.</p>
</body></html>
